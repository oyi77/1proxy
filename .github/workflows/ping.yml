name: Ping

on:
  schedule:
    - cron: '*/3 * * * *'
  workflow_dispatch:

jobs:
  ping-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: |
          curl -s -o /dev/null -w "%{http_code}" https://1proxy-api.aitradepulse.com/health || true
          curl -s -o /dev/null -w "%{http_code}" https://1proxy-api.aitradepulse.com/api/v1/proxies?limit=1 || true
