[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = .
addopts =
    --strict-markers
    --asyncio-mode=strict
    --cov=app
    --cov-report=html
    --cov-report=term-missing

markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests (run with '-m integration')
    unit: marks tests as unit tests

env =
    DATABASE_URL=sqlite+aiosqlite:///./data/test_1proxy.db
    SECRET_KEY=test_secret_key_for_jwt_tokens
    GITHUB_CLIENT_ID=mock_client_id
    GITHUB_CLIENT_SECRET=mock_client_secret
    GOOGLE_CLIENT_ID=mock_google_id
    GOOGLE_CLIENT_SECRET=mock_google_secret
    API_URL=http://localhost:8000
    FRONTEND_URL=http://localhost:3000
